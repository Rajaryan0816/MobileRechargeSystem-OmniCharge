# Api_Gateway Configuration for Docker Profile
server.port=8080
spring.cloud.discovery.enabled=true
eureka.client.serviceUrl.defaultZone=http://eureka-service:8761/eureka/

# Functional Routes (Simplified to avoid body corruption)
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=lb://USERSERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.mvc.routes[1].id=user-service
spring.cloud.gateway.mvc.routes[1].uri=lb://USERSERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/user/**

spring.cloud.gateway.mvc.routes[2].id=admin-service
spring.cloud.gateway.mvc.routes[2].uri=lb://USERSERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/admin/**

spring.cloud.gateway.mvc.routes[3].id=operator-service
spring.cloud.gateway.mvc.routes[3].uri=lb://OPERATORSERVICE
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/operator/**

spring.cloud.gateway.mvc.routes[4].id=recharge-service
spring.cloud.gateway.mvc.routes[4].uri=lb://RECHARGESERVICE
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/recharges/**

spring.cloud.gateway.mvc.routes[5].id=payment-service
spring.cloud.gateway.mvc.routes[5].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/payments/**

# Swagger Doc Routes
spring.cloud.gateway.mvc.routes[6].id=user-service-docs
spring.cloud.gateway.mvc.routes[6].uri=lb://USERSERVICE
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/user-service/v3/api-docs
spring.cloud.gateway.mvc.routes[6].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.mvc.routes[7].id=operator-service-docs
spring.cloud.gateway.mvc.routes[7].uri=lb://OPERATORSERVICE
spring.cloud.gateway.mvc.routes[7].predicates[0]=Path=/operator-service/v3/api-docs
spring.cloud.gateway.mvc.routes[7].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.mvc.routes[8].id=recharge-service-docs
spring.cloud.gateway.mvc.routes[8].uri=lb://RECHARGESERVICE
spring.cloud.gateway.mvc.routes[8].predicates[0]=Path=/recharge-service/v3/api-docs
spring.cloud.gateway.mvc.routes[8].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.mvc.routes[9].id=payment-service-docs
spring.cloud.gateway.mvc.routes[9].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.mvc.routes[9].predicates[0]=Path=/payment-service/v3/api-docs
spring.cloud.gateway.mvc.routes[9].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.mvc.routes[10].id=notification-service-docs
spring.cloud.gateway.mvc.routes[10].uri=lb://NOTIFICATIONSERVICE
spring.cloud.gateway.mvc.routes[10].predicates[0]=Path=/notification-service/v3/api-docs
spring.cloud.gateway.mvc.routes[10].filters[0]=SetPath=/v3/api-docs

# Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Operator Service
springdoc.swagger-ui.urls[1].url=/operator-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Recharge Service
springdoc.swagger-ui.urls[2].url=/recharge-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Payment Service
springdoc.swagger-ui.urls[3].url=/payment-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Notification Service
springdoc.swagger-ui.urls[4].url=/notification-service/v3/api-docs

# Circuit Breaker Defaults
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.timelimiter.configs.default.timeoutDuration=5s

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.endpoints.web.exposure.include=health,info,metrics,prometheus
